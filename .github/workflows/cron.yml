name: Daily SAM run

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC ≈ 9am ET
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron endpoint
        run: |
          curl -fsS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/run-daily" \
            -m 600
