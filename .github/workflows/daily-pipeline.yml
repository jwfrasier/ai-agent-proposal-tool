name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC ≈ 9am ET daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild

      - uses: actions/checkout@v4
        with:
          ref: pipeline-data
          path: dbstate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore DB from pipeline-data
        run: |
          mkdir -p data/traces
          gunzip -c dbstate/govcontracts.db.gz > data/govcontracts.db
          echo "restored $(du -h data/govcontracts.db | cut -f1) DB"

      - name: Run pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          CRON_SECRET: ci-not-used
          APP_PASSWORD: ci-not-used
          DAILY_COST_CAP_USD: "2.00"
          DATABASE_URL: ./data/govcontracts.db
          ANTHROPIC_MODEL: claude-sonnet-4-6
          LOG_LEVEL: info
          TRACE_DIR: ./data/traces
        run: |
          echo "run_start_ms=$(date +%s)000" >> "$GITHUB_OUTPUT"
          npx tsx scripts/run-now.ts 2>&1 | tee pipeline-output.txt
          tail -20 pipeline-output.txt

      - name: Check for new leads (fit >= 50)
        id: leads
        run: |
          sqlite3 data/govcontracts.db "
            SELECT '- **' || s.fit_score || ' ' || s.recommendation || '** — ' || o.title ||
                   ' (' || o.agency || ') · due ' || coalesce(date(o.response_deadline/1000,'unixepoch'),'n/a') ||
                   ' · notice ' || o.notice_id
            FROM scores s JOIN opportunities o ON o.notice_id = s.opportunity_id
            WHERE s.created_at >= ${{ steps.pipeline.outputs.run_start_ms }}
              AND s.fit_score >= 50
            ORDER BY s.fit_score DESC;" > leads.txt
          if [ -s leads.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat leads.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no leads at or above threshold"
          fi

      - name: Open/refresh leads issue
        if: steps.leads.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now="$(date -u +%Y-%m-%d)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Daily pipeline scored new opportunities at or above fit 50 on $now."
            echo ""
            cat leads.txt
            echo ""
            echo "Run: $run_url — full details in the screener DB (pipeline-data branch)."
          } > issue-body.md
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label pipeline-leads --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment -R "$GITHUB_REPOSITORY" "$open" --body-file issue-body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "Screener leads: new opportunities scored >= 50" \
              --label pipeline-leads \
              --body-file issue-body.md
          fi

      - name: Persist DB snapshot to pipeline-data
        if: always() && steps.pipeline.outcome == 'success'
        run: |
          gzip -c data/govcontracts.db > dbstate/govcontracts.db.gz
          cd dbstate
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -m "pipeline DB snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -f origin snapshot:pipeline-data
          echo "pushed DB snapshot"
