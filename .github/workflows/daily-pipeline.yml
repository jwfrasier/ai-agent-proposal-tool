name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC ≈ 9am ET daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild

      - uses: actions/checkout@v4
        with:
          ref: pipeline-data
          path: dbstate

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore DB from pipeline-data
        run: |
          mkdir -p data/traces
          gunzip -c dbstate/govcontracts.db.gz > data/govcontracts.db
          echo "restored $(du -h data/govcontracts.db | cut -f1) DB"

      - name: Run pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
          CRON_SECRET: ci-placeholder-secret-not-used-in-actions
          APP_PASSWORD: ci-not-used
          DAILY_COST_CAP_USD: "2.00"
          DATABASE_URL: ./data/govcontracts.db
          ANTHROPIC_MODEL: claude-sonnet-4-6
          LOG_LEVEL: info
          TRACE_DIR: ./data/traces
        run: |
          set -o pipefail
          echo "run_start_ms=$(date +%s)000" >> "$GITHUB_OUTPUT"
          npx tsx scripts/run-now.ts 2>&1 | tee pipeline-output.txt
          tail -20 pipeline-output.txt

      - name: Check for new leads (fit >= 50)
        id: leads
        env:
          RUN_START_MS: ${{ steps.pipeline.outputs.run_start_ms }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sqlite3, datetime
          con = sqlite3.connect('data/govcontracts.db')
          rows = con.execute("""
            SELECT o.notice_id, o.title, o.agency, o.set_aside, o.naics, s.fit_score,
                   s.recommendation, o.response_deadline, s.win_themes, s.risks,
                   s.key_requirements, o.raw_json, o.description
            FROM scores s JOIN opportunities o ON o.notice_id = s.opportunity_id
            WHERE s.created_at >= ? AND s.fit_score >= 50
            ORDER BY s.fit_score DESC""", (int(os.environ['RUN_START_MS']),)).fetchall()
          def bullets(js, cap=4):
              try: items = json.loads(js)[:cap]
              except Exception: return '  - (unparsed)\n'
              return ''.join(f'  - {i}\n' for i in items) or '  - (none)\n'
          out = []
          for nid, title, agency, sa, naics, fit, rec, ddl, wt, rk, kr, raw, desc in rows:
              due = datetime.datetime.utcfromtimestamp(ddl/1000).strftime('%a %b %d, %Y') if ddl else 'n/a'
              try: links = json.loads(raw).get('resourceLinks') or []
              except Exception: links = []
              out.append(f"## {fit} {rec} — {title}\n\n"
                  f"**{agency}** · due **{due}** · set-aside: {sa or 'not stated'} · NAICS {naics or 'n/a'}\n"
                  f"[SAM notice](https://sam.gov/opp/{nid}/view) · {len(links)} attachment(s)\n\n"
                  f"**Why it fits:**\n{bullets(wt)}\n**Risks:**\n{bullets(rk)}\n"
                  f"**Key requirements:**\n{bullets(kr)}\n"
                  + (f"**Summary:** {desc[:400]}…\n" if desc else ''))
          open('leads.md','w').write('\n---\n\n'.join(out))
          print(f"{len(rows)} lead(s) at or above threshold")
          PYEOF
          if [ -s leads.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Open/refresh leads issue
        if: steps.leads.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now="$(date -u +%Y-%m-%d)"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Daily pipeline scored new opportunities at or above fit 50 on $now."
            echo ""
            cat leads.md
            echo ""
            echo "Run: $run_url — full details in the screener DB (pipeline-data branch)."
          } > issue-body.md
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label pipeline-leads --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment -R "$GITHUB_REPOSITORY" "$open" --body-file issue-body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "Screener leads: new opportunities scored >= 50" \
              --label pipeline-leads \
              --body-file issue-body.md
          fi

      - name: Persist DB snapshot to pipeline-data
        if: always() && steps.pipeline.outcome == 'success'
        run: |
          sqlite3 data/govcontracts.db "PRAGMA wal_checkpoint(TRUNCATE);"
          gzip -c data/govcontracts.db > dbstate/govcontracts.db.gz
          cd dbstate
          git config user.name "pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -m "pipeline DB snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push -f origin snapshot:pipeline-data
          echo "pushed DB snapshot"
