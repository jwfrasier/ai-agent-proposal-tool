name: VAERS demo uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check demo availability
        run: |
          check() {
            resp=$(curl -sS -m 20 -w '\n%{http_code}' https://vaers-demo.vercel.app/ || printf '\n000')
            code=$(printf '%s' "$resp" | tail -1)
            body=$(printf '%s' "$resp" | sed '$d')
            [ "$code" = "200" ] || { echo "landing HTTP $code"; return 1; }
            printf '%s' "$body" | grep -q "Demonstration prototype" || { echo "landing content mismatch"; return 1; }
            api=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"mode":"ask","question":""}' \
              https://vaers-demo.vercel.app/api/assist || echo 000)
            [ "$api" = "400" ] || { echo "assist function HTTP $api (expected 400)"; return 1; }
            return 0
          }
          if check; then echo "healthy"; exit 0; fi
          echo "first check failed; retrying in 45s"
          sleep 45
          if check; then echo "recovered on retry"; exit 0; fi
          echo "demo is DOWN"
          exit 1

      - name: Open incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label vaers-demo-down --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "VAERS demo is DOWN (vaers-demo.vercel.app)" \
              --label vaers-demo-down \
              --body "Automated uptime check failed at $(date -u +%Y-%m-%dT%H:%M)Z. The Tab 2-2 prototype link is unreachable or unhealthy. Check https://vercel.com status, then redeploy: cd docs/responses/2026-09-04-cdc-vaers/prototype && vercel deploy --prod. Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Close incident issue when healthy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label vaers-demo-down --state open --json number --jq '.[].number'); do
            gh issue close -R "$GITHUB_REPOSITORY" "$n" -c "Demo healthy again at $(date -u +%Y-%m-%dT%H:%M)Z."
          done
